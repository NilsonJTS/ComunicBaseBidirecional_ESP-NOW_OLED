;[env:esp32dev]
;platform = espressif32
;board = esp32dev
;framework = arduino


[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9

# CONFIGURAÇÃO DA PLACA EMISSORA
[env:ttgo_emissor]
;upload_port = COM3          ; <-- Substitua pela porta USB do seu Emissor
;monitor_port = COM3
build_src_filter = +<*> -<receptor.cpp> -<main.cpp>

# CONFIGURAÇÃO DA PLACA RECEPTORA
[env:ttgo_receptor]
;upload_port = COM4          ; <-- Substitua pela porta USB do seu Receptor
;monitor_port = COM4
build_src_filter = +<*> -<emissor.cpp> -<main.cpp>